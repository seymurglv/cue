[workspace]
resolver = "3"
members = [
  "app/crates/core",
  "app/crates/engines",
  "app/crates/platform-win",
  "app/crates/cli",
  "app/src-tauri",
  "bench",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
cue-core = { path = "app/crates/core" }
cue-engines = { path = "app/crates/engines" }
cue-platform-win = { path = "app/crates/platform-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "native-tls", "http2"] }
keyring = "4.2"
rpassword = "7"
hound = "3.5"
# libopus 1.3.1 in Rust (no C build): the recordings of the history are Ogg Opus. Pinned: it is a translation.
unsafe-libopus = "=0.2.0"
cpal = "0.18"
# The speech model's features: a real FFT for the log-mel (`cue-engines::parakeet`).
realfft = "3"
# ONNX Runtime for the speech model, CPU only. Pinned: a release candidate. On Windows its prebuilt runtime links
# statically (no DLL beside CUE) and needs an AVX2 processor.
ort = "=2.0.0-rc.15"
# Checking the downloaded model's files.
sha1 = "0.10"
sha2 = "0.10"
# The leak scan of a build (cue-cli): exact texts and fixed patterns over bytes.
aho-corasick = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_DataExchange",
  "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_RemoteDesktop", "Win32_System_Power",
  "Win32_Storage_FileSystem", "Win32_System_Variant", "Win32_System_Registry", "Win32_UI_HiDpi",
  "Win32_Graphics_Dwm", "ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections",
] }
