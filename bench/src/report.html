<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUE — bench</title>
<style>
:root{--bg:#FBFBFA;--card:#fff;--text:#111;--muted:#8E8E8B;--line:#ECECE9;--ok:#1E9E5A}
@media (prefers-color-scheme:dark){:root{--bg:#0E0E0F;--card:#151517;--text:#ECECEA;--muted:#85858A;--line:#232326;--ok:#33C27A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:15px;font-weight:600;margin:0 0 4px}
h2{font-size:13px;font-weight:600;margin:22px 0 0}
p.lead{color:var(--muted);margin:0 0 28px}
section{border-top:1px solid var(--line);padding:22px 0}
.meta{color:var(--muted);font-size:12.5px;margin-bottom:10px}
audio{width:100%;height:32px;margin-bottom:12px}
.q{font-size:12.5px;color:var(--muted);margin:14px 0 6px}
label,.one{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
label{cursor:pointer}
label:has(input:disabled){cursor:default}
.one{color:var(--muted)}
label:has(input:checked){border-color:var(--ok)}
label b{font-weight:600;margin-right:6px}
.tag{display:none;color:var(--muted);font-size:12px;margin-left:8px}
body.revealed .tag{display:inline}
input{margin-right:8px;accent-color:var(--ok)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer}
.wide{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600}
.note{color:var(--muted);font-size:12.5px;margin-top:6px}
#sum{display:none}
</style>
</head>
<body>
<main>
<h1>CUE · comparison bench</h1>
<p class="lead">Listen to each recording and pick the best variant. Engine and model names stay hidden until the results.</p>
<div id="items"></div>
<section><button id="show">Show results</button> <button id="save">Save choices</button>
<div id="sum"></div></section>
</main>
<script>
const DATA = /*DATA*/;
const LETTERS = 'ABCDEFGH';
// Boundary of short dictations for "short ones — Haiku, long ones — Sonnet".
const SHORT_MS = 10000;
// Shuffle by key (recording file + question): the same order on every open, independent between recordings.
// Key → FNV-1a → mulberry32: for neighboring keys the first numbers are unrelated (with a linear generator seeded by
// the recording number they would grow with the number, and the variant order would come in stripes).
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(a, key) { const r = a.slice(), next = rng(hash(key)); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Absolute file:///: encodeURI handles spaces and Cyrillic; it leaves "#" and "?" alone, so those are encoded separately.
const audioUrl = (p) => 'file:///' + encodeURI(p.replace(/\\/g, '/').replace(/^\/+/, '')).replace(/[?#]/g, encodeURIComponent);
// Identical texts are one variant: a choice counts for everyone who produced it.
function variants(list, key) {
  const byText = new Map();
  list.forEach((v) => { const t = v.text || ''; if (!byText.has(t)) byText.set(t, []); byText.get(t).push(v[key]); });
  return [...byText].map(([text, keys]) => ({ text, keys }));
}
const GROUPS = [];
const box = document.getElementById('items');
DATA.forEach((it, n) => {
  const g = {
    stt: shuffle(variants(it.stt.filter((s) => !s.error), 'engine'), it.file + '|stt'),
    ref: shuffle(variants(it.refine, 'model'), it.file + '|ref'),
  };
  GROUPS.push(g);
  // Fewer than two distinct variants — nothing to compare: the question is skipped, the text stays for reference.
  const ask = (name, what, question, list) => {
    if (list.length === 0) return '';
    const tag = (v) => `<span class="tag">${esc(v.keys.join(', '))}</span>`;
    if (list.length < 2) {
      const why = list[0].keys.length > 1 ? 'the variants are identical' : 'only one variant';
      return `<div class="q">${what}: ${why}</div><div class="one">${esc(list[0].text || '—')}${tag(list[0])}</div>`;
    }
    return `<div class="q">${what}: ${question}</div>` + list.map((v, i) =>
      `<label><input type="radio" name="${name}${n}" value="${i}"><b>${LETTERS[i] || i + 1}</b>${esc(v.text || '—')}${tag(v)}</label>`).join('');
  };
  const sec = document.createElement('section');
  sec.innerHTML = `<div class="meta">${n + 1} of ${DATA.length} · ${esc(it.app)} · ${(it.audio_ms / 1000).toFixed(1)} s</div>
    <audio controls preload="none" src="${esc(audioUrl(it.file))}"></audio>
    ${ask('stt', 'Transcription', 'which text conveys what was said more accurately?', g.stt)}
    ${ask('ref', 'Refine', 'which text would you paste without editing? Does it sound like you?', g.ref)}`;
  box.append(sec);
});
// The chosen variant of a question — all engines or models that produced this text; nothing chosen — null.
function picked(name, n) {
  const el = document.querySelector(`input[name="${name}${n}"]:checked`);
  return el ? GROUPS[n][name][+el.value].keys : null;
}
function choices() {
  return DATA.map((it, n) => ({ file: it.file, stt: picked('stt', n), refine: picked('ref', n) }));
}
function median(v) { const s = v.slice().sort((a, b) => a - b), n = s.length; return n === 0 ? null : n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; }
// 90th percentile by nearest rank.
function p90(v) { const s = v.slice().sort((a, b) => a - b), r = Math.ceil(0.9 * s.length); return r ? s[r - 1] : null; }
const ms = (x) => (x === null ? '—' : `${Math.round(x)} ms`);
// Results for one question. Latency counts successful calls only: one cold or hung call does not move the median.
function table(title, name, runsOf, key, failed) {
  const ch = choices(), acc = new Map();
  const get = (k) => { if (!acc.has(k)) acc.set(k, { all: 0, short: 0, long: 0, lat: [], calls: 0, fails: 0 }); return acc.get(k); };
  let asked = 0, answered = 0;
  DATA.forEach((it, n) => {
    runsOf(it).forEach((r) => { const a = get(r[key]); a.calls++; if (failed(r)) a.fails++; else a.lat.push(r.latency_ms); });
    if (GROUPS[n][name].length >= 2) asked++;
    const keys = name === 'stt' ? ch[n].stt : ch[n].refine;
    if (!keys) return;
    answered++;
    keys.forEach((k) => { const a = get(k); a.all++; if (it.audio_ms < SHORT_MS) a.short++; else a.long++; });
  });
  const rows = [...acc].map(([k, a]) => `<tr><td>${esc(k)}</td><td>${a.all}</td><td>${a.short}</td><td>${a.long}</td><td>${ms(median(a.lat))}</td><td>${ms(p90(a.lat))}</td><td>${a.fails} of ${a.calls}</td></tr>`).join('');
  return `<h2>${title}</h2><div class="note">Answered ${answered} of ${asked}. Identical texts are one variant; a choice counts for everyone who produced it. Latency is from successful calls.</div>
    <div class="wide"><table><tr><th>${name === 'stt' ? 'Engine' : 'Model'}</th><th>Chosen</th><th>&lt; 10 s</th><th>≥ 10 s</th><th>Median</th><th>p90</th><th>Failures</th></tr>${rows}</table></div>`;
}
document.getElementById('show').onclick = () => {
  const sum = document.getElementById('sum');
  // The names are visible now, so the choices are locked: everything in choices.json was chosen blind.
  document.querySelectorAll('#items input').forEach((i) => { i.disabled = true; });
  sum.innerHTML = '<div class="note">Choices are locked: variants cannot be switched after the results.</div>'
    + table('Transcription', 'stt', (it) => it.stt, 'engine', (r) => r.error !== null && r.error !== undefined)
    + table('Refine', 'ref', (it) => it.refine, 'model', (r) => r.outcome !== 'Refined');
  sum.style.display = 'block';
  document.body.classList.add('revealed');
};
document.getElementById('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(choices(), null, 2)], { type: 'application/json' }));
  a.download = 'choices.json';
  a.click();
};
</script>
</body>
</html>
