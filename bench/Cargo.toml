[package]
name = "cue-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cue-core.workspace = true
cue-engines.workspace = true
# Only for `focus::UNKNOWN_APP`: the same "unknown" name the app would pass.
cue-platform-win.workspace = true
serde.workspace = true
serde_json.workspace = true
# `signal` is for Ctrl+C: the first press is a stop request the run looks at between steps, not the end of the process.
tokio = { workspace = true, features = ["signal"] }
hound.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
