<style>
/* CUE — shared tokens and the colors of the live mark.
   Free fonts (SIL OFL): Bebas Neue — logo and digits, Montserrat ExtraBold — rare large headings. */
:root{
  --bg:#FBFBFA;--card:#FFFFFF;--surface2:#F3F3F1;--text:#111111;--muted:#6B6B67;--faint:#C4C4C0;--line:#ECECE9;
  --rec:#FF4A1C;--warn:#EE9A00;--ask:#2F6BFF;--ok:#1E9E5A;--graphite:#1C1C1F;
  /* amber as the words of a button: --warn darkened to 4.5:1 on a button's fill in the light theme */
  --warn-ink:#945500;
  --mac-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --win-font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI","Inter",system-ui,sans-serif;
  --num-font:"Bebas Neue","Montserrat",sans-serif;
  --head-font:"Montserrat",sans-serif;
  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.3,1.25,.5,1);
}
[data-theme=dark]{
  --bg:#0E0E0F;--card:#151517;--surface2:#1C1C1F;--text:#ECECEA;--muted:#85858A;--faint:#4A4A4E;--line:#232326;
  --rec:#FF5A2E;--warn:#F5B82E;--ask:#5C8DFF;--ok:#33C27A;--graphite:#242428;
  --warn-ink:#F5B82E;
}
/* live mark: the lines take currentColor, the lamp takes the signal color */
.mk .m-l{stroke:currentColor;stroke-linecap:round;transition:stroke .3s}
.mk .m-dot{fill:var(--rec);transition:fill .3s}
.mk[data-tone=warn] .m-l{stroke:var(--warn)}
.mk[data-tone=warn] .m-dot{fill:var(--warn)}
.mk[data-tone=ask] .m-l{stroke:var(--ask)}
.mk[data-tone=ask] .m-dot,.mk[data-tone=askrec] .m-dot{fill:var(--ask)}
.mk[data-tone=mono] .m-dot{fill:currentColor}

/* CUE — the main window: its header, the History section and the settings tray from the gear. Ported from the approved    design (stage 5, design/05-main-window/final.html), Windows look, only these parts: no Today, Dictionary or Habits    sections and no links to them in the header, no window chrome of its own (Windows draws the frame), no dictionary or    habit chips under an opened history row. Layout, classes and motion are the design's; where it had a macOS and a    Windows variant, the Windows one is folded into the rule. The theme follows prefers-color-scheme (the page sets    data-theme on <html>; the tokens and their dark values are design/cue.css).    Added for the real data: a history row shows its mode (a small badge; none for a plain dictation, its place kept)    and its app as muted text before the text, an "Ask" question muted before the answer; a period note and a "not    connected" mark in menus; long menus scroll; a key field; quiet lines for an empty history and for nothing found.    Since: runs from one app stacked, the search grown out of the magnifier on the heading's line, an opened row's    recording as a thin progress line in place of the design's waveform, the history's period and Clear history on the    tray's History page instead of under the list; every control one capsule 28 px high (docs/specs/2026-11-02-selectors.md):    fields, drop-downs and the connection card with a hairline ring that darkens with the focus, buttons and segments    filled, menus rounded to match. */ *,*::before,*::after{box-sizing:border-box;margin:0;padding:0} html{color-scheme:light;background:var(--bg)} html[data-theme=dark]{color-scheme:dark} /* Before the page script has set the theme: no white flash in a dark Windows. */ @media (prefers-color-scheme: dark){html:not([data-theme]){background:#0E0E0F;color-scheme:dark}} html,body{height:100%} body{overflow:hidden;background:var(--bg);color:var(--text)} button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit} button:disabled{cursor:default} input{font:inherit;color:inherit;letter-spacing:inherit}  /* ================= the window ================= */ .app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--win-font);font-size:13px;line-height:1.45;letter-spacing:0;-webkit-font-smoothing:antialiased;interpolate-size:allow-keywords;--e-sm:cubic-bezier(.32,.72,0,1)} /* --e-sm: a smooth ease without overshoot for parts that grow (height to auto cannot overshoot: a spring is cut off).    Growing parts go from height 0 to auto, not grid rows 0fr to 1fr: Chromium resolves the fraction against the box's    own height, so while the box grows by f its content shows only f² of itself and an empty band opens under it. */ .app svg{display:block;flex:none} .app [hidden]{display:none!important} .app .mut{color:var(--muted)} .app mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:2px}  /* small parts */ .ibt{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s,opacity .2s} .ibt:hover{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text)} .ibt.sm{width:24px;height:24px;border-radius:6px} .ibt.sm svg{width:14px;height:14px} .ibt.done{color:var(--ok)} /* the keyboard's focus on an icon button: the soft plate and a dark glyph, not the system's ring */ .ibt:focus-visible{outline:0;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text)} /* icon buttons in headers — the gear, the tray's back and close, the search's cross — are the glyph alone: under the    pointer it darkens, pressed it gives a little; the target is 40 px round the 28 px button */ .gear,.tph .ibt,.hsb .hsbt{position:relative} .gear::before,.tph .ibt::before,.hsb .hsbt::before{content:"";position:absolute;inset:-6px} .gear:hover,.tph .ibt:hover,.hsb .hsbt:hover{background:none;color:var(--text)} .gear svg,.tph .ibt svg,.hsb .hsbt svg{transition:scale .2s var(--e-out)} .gear:active svg,.tph .ibt:active svg,.hsb .hsbt:active svg{scale:.88} .btn2{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 6px;border-radius:999px;background:color-mix(in srgb,var(--text) 7%,transparent);font-size:12px;font-weight:500;white-space:nowrap} .btn2 svg{width:14px;height:14px} .btn2:hover{background:color-mix(in srgb,var(--text) 11%,transparent)} .btn2.ck{padding:0 10px} /* "Clear history" */ .btn2.warn{color:var(--warn-ink)} .btn2 .lbl{display:inline-flex} .btn2:disabled{opacity:.5} /* a key field: a capsule with a hairline ring, as the history's search and the Dictionary's "+ Word"; the ring darkens    with the focus */ .kin{width:100px;height:28px;padding:0 12px;border:0;outline:0;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--faint);font-size:12px;color:var(--text);transition:box-shadow .2s} .kin:focus{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 45%,transparent)} .kin::placeholder{color:var(--muted)} /* switch */ .sw{position:relative;flex:none;width:40px;height:20px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 60%,transparent);transition:background .25s,box-shadow .25s} .sw::after{content:"";position:absolute;left:4px;top:4px;width:12px;height:12px;border-radius:50%;background:color-mix(in srgb,var(--text) 78%,transparent);transition:transform .4s var(--e-spring),background .25s} .sw[aria-checked=true]{background:var(--text);box-shadow:none} .sw[aria-checked=true]::after{transform:translateX(20px);background:var(--card)} /* segments: a capsule; the thumb and the buttons inside it are 2 px in, so their radius is 2 less */ .segc{position:relative;display:inline-flex;padding:2px;border-radius:14px;background:color-mix(in srgb,var(--text) 6%,transparent);isolation:isolate} .segc button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .2s} .segc button[aria-pressed=true]{color:var(--text)} .segc .thb{position:absolute;z-index:0;top:2px;bottom:2px;left:0;width:0;border-radius:12px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.06);transition:transform .45s var(--e-spring),width .45s var(--e-spring)} [data-theme=dark] .segc .thb{background:color-mix(in srgb,var(--text) 15%,transparent)} /* drop-down: the field's capsule and ring; under the pointer the ring darkens */ .dd{display:inline-flex;align-items:center;gap:6px;height:28px;max-width:190px;padding:0 10px 0 12px;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--faint);font-size:12px;white-space:nowrap;transition:box-shadow .2s} .dd:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 30%,transparent)} .dd .ddv{overflow:hidden;text-overflow:ellipsis} .dd svg{width:12px;height:12px;color:var(--muted);transform:rotate(90deg)} /* the Cleanup page's connection card: a lamp (green once the connection is ready), the name, its state under it; it opens    the list of connections at its own width. The drop-down's ring at the card's size. */ .srow.wide{display:block} .pk{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 12px 6px 14px;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--faint);text-align:left;transition:box-shadow .2s} .pk:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 30%,transparent)} .pk .pt{flex:1;min-width:0} .pk .pt b{display:block;font-weight:500;font-size:13px} .pk .pt small{display:block;margin-top:1px;overflow:hidden;font-size:11px;line-height:1.35;color:var(--muted);text-overflow:ellipsis;white-space:nowrap} .pk>svg{flex:none;width:12px;height:12px;color:var(--muted);transform:rotate(90deg)} .pk .lamp,.menu .mlamp{flex:none;width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--text) 25%,transparent);transition:background-color .3s} .pk .lamp.on,.menu .mlamp.on{background:var(--ok)} /* a local server's address is longer than a key's mask: the field takes the line under the row's name */ .srow[data-server]{flex-wrap:wrap;row-gap:6px} .srow[data-server] .stx{flex-basis:100%} .srow[data-server] .sc{flex:1 1 100%;max-width:none;flex-wrap:nowrap} .srow[data-server] .kin{flex:1;width:auto;min-width:0} /* the custom style's instructions: the fields' ring */ .cta{display:block;width:100%;min-height:64px;resize:vertical;padding:8px 12px;border:0;outline:0;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--faint);font:inherit;font-size:12px;line-height:1.45;color:var(--text);transition:box-shadow .2s} .cta:focus{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 45%,transparent)} /* menus: 4 px in from the edge, so an item's radius is 4 less than the menu's */ .menu{position:absolute;z-index:45;min-width:180px;max-width:320px;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;padding:4px;border-radius:14px;background:var(--card);box-shadow:0 14px 32px -10px rgba(0,0,0,.32),0 0 0 .5px color-mix(in srgb,var(--text) 18%,transparent);transform-origin:50% 0;animation:mnIn .32s var(--e-spring)} [data-theme=dark] .menu{background:#222225} .menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:28px;padding:0 8px 0 10px;border-radius:10px;font-size:12px;text-align:left;white-space:nowrap} .menu button:hover{background:color-mix(in srgb,var(--text) 6%,transparent)} .menu button svg{width:14px;height:14px} .menu .mlb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis} .menu .mnc{font-size:11px;color:var(--muted)} /* a richer list: group headings, two lines (a name and its state or price), a quiet chip, a lamp; as wide as its button */ .menu .mg{padding:8px 10px 3px;font-size:11px;font-weight:600;color:var(--muted)} .menu .mg:first-child{padding-top:4px} .menu.two button{height:auto;min-height:28px;padding-top:5px;padding-bottom:5px} .menu .mt{display:flex;flex:1;flex-direction:column;min-width:0} .menu .mt .mlb{font-weight:500} .menu .msub{overflow:hidden;font-size:11px;color:var(--muted);text-overflow:ellipsis} .menu .mbadge{flex:none;padding:1px 6px;border-radius:9px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 16%,transparent);font-size:11px;color:var(--muted)} .menu.wide{max-width:none} .menu .mnote{padding:6px 10px 4px;border-top:1px solid var(--line);margin-top:4px;font-size:11px;line-height:1.35;color:var(--muted);white-space:normal} @keyframes mnIn{from{opacity:0;transform:translateY(-4px) scale(.97)}} /* microphone level */ .meter{display:flex;gap:2px;align-items:center;height:14px} .meter i{width:4px;height:100%;border-radius:2px;background:color-mix(in srgb,var(--text) 12%,transparent);transition:background .08s} .meter i.on{background:var(--text)}  /* history */ .hday{font-size:11px;font-weight:600;color:var(--muted);margin:16px 0 4px} .hgrp:first-child .hday{margin-top:2px} .hl{display:flex;flex-direction:column;margin:0 -8px} /* the list stays short: the rest of today and every earlier day grow out of their line and fold back into it */ .hfold{height:0;overflow:hidden;visibility:hidden;transition:height .5s var(--e-sm),visibility 0s .5s} .hfold.open{height:auto;visibility:visible;transition:height .5s var(--e-sm)} .hmt{display:flex;width:calc(100% + 16px);margin:2px -8px 0;padding:8px;border-radius:8px;font-size:12px;line-height:20px;color:var(--muted);text-align:left;transition:background .2s,color .2s} .hmt:hover,.hdl:hover{background:color-mix(in srgb,var(--text) 4%,transparent)} .hmt:hover{color:var(--text)} .hearl{margin-top:20px} .hdl{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:10px;align-items:center;width:calc(100% + 16px);margin:0 -8px;padding:8px;border-radius:8px;font-size:13px;line-height:20px;color:var(--text);text-align:left;transition:background .2s} .hdapps{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hdl .hcnt{margin:0} .hdl svg{width:12px;height:12px;color:var(--muted);transition:transform .45s var(--e-spring)} .hfd.open>.hdl svg{transform:rotate(90deg)} .hfd.open>.hdl .hcnt{background:color-mix(in srgb,var(--text) 13%,transparent);color:var(--text)} .hmt:focus-visible,.hdl:focus-visible{outline:0;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 40%,transparent)} .hr{position:relative;display:grid;grid-template-columns:38px 20px 1fr auto;column-gap:10px;align-items:start;padding:8px;border-radius:8px;transition:background .2s} .hr:hover{background:color-mix(in srgb,var(--text) 4%,transparent)} .hr.new{animation:rowIn .6s var(--e-spring),rowHl 2.6s var(--e-out)} @keyframes rowIn{from{opacity:0;transform:translateY(-8px)}} @keyframes rowHl{0%,30%{background:color-mix(in srgb,var(--text) 8%,transparent)}} .ht{font-family:"Bebas Neue",sans-serif;font-size:15px;letter-spacing:.03em;line-height:20px;color:var(--muted);font-variant-numeric:tabular-nums} .aski,.hmi{width:20px;height:20px;border-radius:6px;display:grid;place-items:center} .aski{background:color-mix(in srgb,var(--ask) 14%,transparent);color:var(--ask)} .hmi{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--muted)} .aski svg,.hmi svg{width:14px;height:14px} .hx{min-width:0} .htx{height:20px;font-size:13px;line-height:20px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;transition:height .45s var(--e-sm)} .htx .happ,.htx .hq{color:var(--muted);margin-right:6px} .hact{display:flex;gap:2px;margin:-3px -4px -3px 0;opacity:0;transition:opacity .2s} .hr:hover .hact,.hr:focus-within .hact,.hr.open .hact{opacity:1} /* an opened row: its whole text, then how it was said and its recording (the question of an "Ask" moves down there);    both grow in one motion, and while it closes (.shut   if (st.level === 'off') return t('off');
  if (st.runs === 'cloud') return `${mName()}`;
  if (st.dl) return `${t('downloading')} ${Math.round(st.dl.p)} %`;
  return LOCAL[st.local].name + (st.have[st.local] ? '' : ' · ' + t('download').toLowerCase());
}
function libSize() { let s = 0; for (const [id, h] of Object.entries(st.speechHave)) if (h) s += SPEECH[id].size; for (const [id, h] of Object.entries(st.have)) if (h) s += LOCAL[id].size; return s; }

function pageMain() {
  return head(t('settings'), false) + `<div class="tpb"><div role="group">${trw('model', t('speech'), `${SPEECH[st.speech].name}`, 'speech')}${trw('cleanup', t('cleanup'), cleanupValue(), 'cleanup')}${trw('mic', t('mic'), t('micVal'))}${trw('languages', t('languages'), t('langVal'))}${trw('history', t('history'), t('histVal'))}${trw('general', t('general'), t('genVal'))}<div style="border-top:1px solid var(--line);margin:6px 0"></div>${trw('disk', t('library'), gb(libSize()), 'library')}</div></div>`;
}

const levelRow = () => row(t('level'), t(st.level === 'off' ? 'lvOff' : st.level === 'light' ? 'lvLight' : 'lvMedium'), seg('level', [['off', t('off')], ['light', t('lightL')], ['medium', t('medium')]], st.level));
const strengthRow = () => row(t('strength'), t(st.level === 'light' ? 'lvLight' : 'lvMedium'), seg('level', [['light', t('lightL')], ['medium', t('medium')]], st.level));
const instrRow = () => `<div class="srow pick" data-act="instr"><div class="stx"><b>${t('instr')}</b><small>${st.instr.trim() ? t('instrSet') : t('instrHint')}</small></div><div class="sc">${I.chev}</div></div>`;

function localStatus(id) {
  if (st.dl && st.dl.id === id) return `<span class="msz num-t">${Math.round(st.dl.p)} %</span><button class="btn2 ck" type="button" data-act="stop">${t('stop')}</button>`;
  if (!st.have[id]) return `<button class="btn2 ck" type="button" data-act="download" data-id="${id}">${t('download')} · ${gb(LOCAL[id].size)}</button>`;
  return `<span class="msz">${gb(LOCAL[id].size)}</span>`;
}
function keyRow(p) {
  const name = PROVIDERS[p].name, saved = !!st.keys[p], c = st.conn[p];
  let small = saved ? (c === 'connected' ? `<span class="ok-ink"><span class="lampi on"></span>${t('connected')}</span>${p === 'anthropic' ? ' · ' + t('askToo') : ''}` : (p === 'anthropic' ? t('askToo') : '')) : t('keyNeed');
  if (c === 'checking') small = t('checking');
  const btn = `<button class="btn2 ck" type="button" data-act="check" data-p="${p}"${saved && c !== 'checking' ? '' : ' disabled'}>${t('check')}</button>`;
  return row(t('key', name), small, `<input class="kin" type="password" autocomplete="off" spellcheck="false" id="kin" data-p="${p}" placeholder="${saved ? st.keys[p] : t('keyPaste')}" style="width:92px">${btn}`);
}
function footer() {
  if (st.level === 'off') return t('ftOff');
  if (st.runs === 'cloud') return t('ftCloud', pName(), mName());
  return t('ftLocal') + (st.have[st.local] ? '' : ' ' + t('ftWait'));
}

function pageCleanupA() {
  let body = levelRow();
  if (st.level !== 'off') {
    const local = st.runs === 'local';
    const title = local ? LOCAL[st.local].name : mName();
    const sub = local ? `${t('free')} · ${tagsOf(LOCAL[st.local])}` : t('yourKey', pName());
    const right = local ? (st.have[st.local] && !st.dl ? `${I.chev}` : localStatus(st.local)) : I.chev;
    body += `<div class="srow wide"><button class="pk" type="button" data-act="models"><span class="lamp${local ? (st.have[st.local] ? ' on' : '') : (st.conn[st.cloud.p] === 'connected' ? ' on' : '')}"></span><span class="pt"><b>${title}</b><small>${sub}</small></span>${I.chev}</button></div>`;
    if (local && (!st.have[st.local] || st.dl)) body += row(t('model'), st.dl ? `${t('downloading')}<div class="pbarline"><i style="width:${st.dl.p}%"></i></div>` : t('notYet'), localStatus(st.local));
    if (!local) body += keyRow(st.cloud.p);
    body += instrRow();
  }
  return head(t('cleanup'), true) + `<div class="tpb"><div class="sgrp">${body}</div><div class="tft">${footer()}</div></div>`;
}

function localRow(id, act = 'pick-local') {
  const m = LOCAL[id], on = st.runs === 'local' && st.local === id;
  const small = `${tagsOf(m)}${m.rec ? ' · ' + t('rec') : ''}`;
  const right = st.dl && st.dl.id === id ? localStatus(id) : st.have[id] ? `<span class="msz">${gb(m.size)}</span>` : `<span class="msz">${gb(m.size)}</span>`;
  return `<div class="mrow pick" data-act="${act}" data-id="${id}"><span class="radio${on ? ' on' : ''}"></span><div class="stx"><b>${m.name}</b><small>${small}${st.have[id] ? '' : ' · ' + t('download').toLowerCase()}</small>${st.dl && st.dl.id === id ? `<div class="pbarline"><i style="width:${st.dl.p}%"></i></div>` : ''}</div><div class="sc">${right}</div></div>`;
}
function pageModels() {
  let html = `<div class="sgrp mlist"><div class="mgh">${t('recFor')}</div>${localRow('gemma')}${cloudRow('anthropic', 'haiku', true)}</div>`;
  html += `<div class="sgrp mlist"><div class="mgh">${t('onPc')}</div>${localRow('qwen')}${localRow('s1')}</div>`;
  html += `<div class="sgrp mlist"><div class="mgh">${t('inCloud')}</div>`;
  for (const [p, prov] of Object.entries(PROVIDERS)) for (const [mid] of prov.models) if (!(p === 'anthropic' && mid === 'haiku')) html += cloudRow(p, mid);
  html += `</div><div class="msr" data-act="hf" style="cursor:pointer"><span class="msg">${I.search}</span><span class="msl">${t('hf')}</span></div>`;
  return head(t('model'), true) + `<div class="tpb" style="max-height:460px;overflow:auto">${html}</div>`;
}
function cloudRow(p, mid, rec) {
  const prov = PROVIDERS[p], name = prov.models.find(([i]) => i === mid)[1], on = st.runs === 'cloud' && st.cloud.p === p && st.cloud.m === mid;
  const keyed = st.conn[p] === 'connected';
  return `<div class="mrow pick" data-act="pick-cloud" data-p="${p}" data-m="${mid}"><span class="radio${on ? ' on' : ''}"></span><div class="stx"><b>${name}</b><small><span class="lampi${keyed ? ' on' : ''}"></span>${prov.name}${rec ? ' · ' + t('rec') : ''}</small></div><div class="sc"><span class="msz">${t('cloud')}</span></div></div>`;
}

function pageCleanupB() {
  const segCur = st.level === 'off' ? 'off' : st.runs;
  let body = `<div class="srow wide">${seg('runs', [['off', t('off')], ['local', t('local')], ['cloud', t('cloud')]], segCur, true)}</div>`;
  if (st.level !== 'off') {
    body += strengthRow();
    if (st.runs === 'local') {
      body += `</div><div class="sgrp mlist"><div class="mgh">${t('model')}</div>${localRow('gemma', 'pick-local-b')}${localRow('qwen', 'pick-local-b')}${localRow('s1', 'pick-local-b')}</div><div class="msr" data-act="hf" style="cursor:pointer"><span class="msg">${I.search}</span><span class="msl">${t('hf')}</span></div><div class="sgrp">`;
    } else {
      const c = st.conn[st.cloud.p];
      body += `<div class="srow wide"><button class="pk" type="button" data-act="m-provider" aria-label="${t('connection')}"><span class="lamp${c === 'connected' ? ' on' : ''}"></span><span class="pt"><b>${pName()}</b><small>${t('connection')}</small></span>${I.chev}</button></div>`;
      body += keyRow(st.cloud.p);
      body += row(t('model'), null, `<button class="dd" type="button" data-act="m-cloud"><span class="ddv">${mName()}</span>${I.chev}</button>`);
    }
    body += instrRow();
  }
  return head(t('cleanup'), true) + `<div class="tpb"><div class="sgrp">${body}</div><div class="tft">${footer()}</div></div>`;
}

function pageSpeech() {
  const r = (id) => { const m = SPEECH[id], on = st.speech === id; const small = (m.en ? t('enOnly') : t('langs25')) + (m.rec ? ' · ' + t('rec') : '') + (st.speechHave[id] ? '' : ' · ' + t('download').toLowerCase());
    return `<div class="mrow pick" data-act="pick-speech" data-id="${id}"><span class="radio${on ? ' on' : ''}"></span><div class="stx"><b>${m.name}</b><small>${small}</small></div><div class="sc"><span class="msz">${gb(m.size)}</span>${on ? `<span class="mok ok-ink">${I.ok}</span>` : ''}</div></div>`; };
  return head(t('speech'), true) + `<div class="tpb"><div class="sgrp mlist"><div class="mgh">${t('speechModels')}</div>${r('ultra')}${r('v3')}${r('v2')}</div><div class="msr" data-act="hf" style="cursor:pointer"><span class="msg">${I.search}</span><span class="msl">${t('hf')}</span></div></div>`;
}

function pageLibrary() {
  let rows = '';
  for (const [id, h] of Object.entries(st.speechHave)) if (h) rows += `<div class="srow mdl"><div class="stx"><b>${SPEECH[id].name}</b><small>${gb(SPEECH[id].size)} · ${t('speechTag')}${st.speech === id ? ' · ' + t('inUse') : ''}</small></div><div class="sc">${st.speech === id ? '' : `<button class="mdel" type="button" data-act="del-speech" data-id="${id}" style="opacity:1">${t('del')}</button>`}</div></div>`;
  for (const [id, h] of Object.entries(st.have)) if (h) rows += `<div class="srow mdl"><div class="stx"><b>${LOCAL[id].name}</b><small>${gb(LOCAL[id].size)} · ${t('cleanTag')}${st.runs === 'local' && st.local === id && st.level !== 'off' ? ' · ' + t('inUse') : ''}</small></div><div class="sc"><button class="mdel" type="button" data-act="del-local" data-id="${id}" style="opacity:1">${t('del')}</button></div></div>`;
  return head(t('library'), true) + `<div class="tpb"><div class="sgrp mlist">${rows}</div><div class="tft">${t('total', gb(libSize()))}</div></div>`;
}

function pageInstr() {
  return head(t('instr'), true) + `<div class="tpb"><div class="sgrp" style="padding-top:6px"><textarea class="cta" id="cta" rows="4" placeholder="${t('instrPh')}">${st.instr.replace(/</g, '&lt;')}</textarea></div><div class="tft">${t('instrFt')}</div></div>`;
}

const PAGES = { main: pageMain, cleanup: () => variant === 'A' ? pageCleanupA() : pageCleanupB(), models: pageModels, speech: pageSpeech, library: pageLibrary, instr: pageInstr };
const DEPTH = { main: 0, cleanup: 1, speech: 1, library: 1, models: 2, instr: 2 };

function placeThumbs(root = document, animate = true) {
  for (const s of root.querySelectorAll('.segc')) {
    const on = s.querySelector('[aria-pressed="true"]'), th = s.querySelector('.thb');
    if (!on || !th || !on.offsetWidth) continue;
    if (!animate) th.style.transition = 'none';
    th.style.width = on.offsetWidth + 'px';
    th.style.transform = `translateX(${on.offsetLeft - 2}px)`;
    if (!animate) { th.offsetWidth; th.style.transition = ''; }
  }
}

function render(dir = 0) {
  closeMenu();
  const tray = $('#tray'), tpg = $('#tpg');
  const keep = {};
  if (dir === 0) for (const s of tpg.querySelectorAll('.segc')) keep[s.id] = s.querySelector('.thb').style.cssText;
  const from = tray.offsetHeight;
  tpg.innerHTML = PAGES[st.page]();
  for (const [id, css] of Object.entries(keep)) { const th = $(`#${id} .thb`, tpg); if (th) { th.style.cssText = css; th.style.transition = 'none'; th.offsetWidth; th.style.transition = ''; } }
  tray.style.height = 'auto';
  const to = tray.offsetHeight;
  tray.style.height = from + 'px'; tray.offsetHeight; tray.style.height = to + 'px';
  requestAnimationFrame(() => placeThumbs(tpg, true));
  if (dir && !matchMedia('(prefers-reduced-motion: reduce)').matches) $('.tpb', tpg).animate([{ transform: `translateX(${dir * 26}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.32,.72,0,1)' });
  const cta = $('#cta');
  if (cta) { cta.addEventListener('input', () => { st.instr = cta.value; }); setTimeout(() => cta.focus(), 340); }
  const kin = $('#kin');
  if (kin) kin.addEventListener('keydown', (e) => { if (e.key === 'Enter' && kin.value.trim()) { const p = kin.dataset.p, v = kin.value.trim(); st.keys[p] = `${v.slice(0, 3)}…${v.slice(-3)}`; checkKey(p); } });
  $('#vnote').innerHTML = t(variant === 'A' ? 'noteA' : 'noteB');
}

function go(page) { const d = DEPTH[page] >= DEPTH[st.page] ? 1 : -1; st.page = page; render(d); }
function back() { go(st.page === 'instr' || st.page === 'models' ? 'cleanup' : 'main'); }
function toast(text) { const el = $('#toast'); el.textContent = text; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.opacity = 0; }, 1600); }
function checkKey(p) { st.conn[p] = 'checking'; render(); setTimeout(() => { st.conn[p] = 'connected'; render(); }, 900); }

function startDownload(id) {
  st.dl = { id, p: 0 }; clearInterval(dlTimer);
  dlTimer = setInterval(() => {
    st.dl.p = Math.min(100, st.dl.p + 1.8 + Math.random() * 2.6);
    if (st.dl.p >= 100) { clearInterval(dlTimer); st.have[id] = true; st.dl = null; render(); return; }
    for (const bar of document.querySelectorAll('.pbarline i')) bar.style.width = st.dl.p + '%';
    for (const n of document.querySelectorAll('.num-t')) n.textContent = Math.round(st.dl.p) + ' %';
  }, 120);
  render();
}
function chooseLocal(id) { st.runs = 'local'; st.local = id; if (!st.have[id] && !(st.dl && st.dl.id === id)) startDownload(id); }

function closeMenu() { if (menuOpen) { menuOpen.m.remove(); menuOpen = null; } }
function menu(button, items, pick) {
  if (menuOpen && menuOpen.b === button) { closeMenu(); return; }
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  items.forEach((it, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.i = i; b.innerHTML = `${it.lamp !== undefined ? `<span class="mlamp${it.lamp ? ' on' : ''}"></span>` : ''}<span class="mlb">${it.label}</span>${it.note ? `<span class="mnc">${it.note}</span>` : ''}${it.on ? I.ok : ''}`; m.append(b); });
  m.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (!b) return; const it = items[+b.dataset.i]; closeMenu(); pick(it.value); });
  const app = $('#app'); app.append(m);
  const ar = app.getBoundingClientRect(), br = button.getBoundingClientRect();
  m.style.left = (br.right - ar.left - m.offsetWidth + app.scrollLeft) + 'px';
  m.style.top = (br.bottom - ar.top + 4 + app.scrollTop) + 'px';
  m.animate([{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'none' }], { duration: 160, easing: 'ease-out' });
  menuOpen = { m, b: button };
}

document.addEventListener('click', (e) => {
  if (e.target.closest('.pbar')) return;
  const el = e.target.closest('[data-act], [data-seg]');
  if (!el) { if (!e.target.closest('.menu')) closeMenu(); return; }
  if (el.dataset.seg) {
    const id = el.dataset.seg, v = el.dataset.v;
    for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', b.dataset.v === v);
    placeThumbs($(`#${id}`).parentElement);
    if (id === 'level') st.level = v;
    if (id === 'runs') { if (v === 'off') st.level = 'off'; else { st.runs = v; if (st.level === 'off') st.level = 'light'; } }
    setTimeout(() => render(), 0); return;
  }
  const a = el.dataset.act;
  if (['cleanup', 'speech', 'library', 'instr', 'models'].includes(a)) go(a);
  else if (a === 'back') back();
  else if (a === 'close') { st.page = 'main'; render(-1); }
  else if (a === 'inert') toast(t('inert'));
  else if (a === 'hf') toast(t('hfToast'));
  else if (a === 'download') startDownload(el.dataset.id);
  else if (a === 'stop') { clearInterval(dlTimer); st.dl = null; render(); }
  else if (a === 'check') checkKey(el.dataset.p);
  else if (a === 'pick-local') { chooseLocal(el.dataset.id); go('cleanup'); }
  else if (a === 'pick-local-b') { chooseLocal(el.dataset.id); render(); }
  else if (a === 'pick-cloud') { st.runs = 'cloud'; st.cloud = { p: el.dataset.p, m: el.dataset.m }; go('cleanup'); }
  else if (a === 'pick-speech') { const id = el.dataset.id; st.speech = id; st.speechHave[id] = true; render(); }
  else if (a === 'del-local' || a === 'del-speech') { const id = el.dataset.id, r = el.closest('.srow'); r.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateX(12px)' }], { duration: 220, easing: 'ease-in' }).onfinish = () => { if (a === 'del-local') st.have[id] = false; else st.speechHave[id] = false; render(); }; }
  else if (a === 'm-provider') menu(el, Object.entries(PROVIDERS).map(([p, pr]) => ({ label: pr.name, value: p, on: st.cloud.p === p, lamp: st.conn[p] === 'connected' })), (p) => { st.cloud = { p, m: PROVIDERS[p].models[0][0] }; render(); });
  else if (a === 'm-cloud') menu(el, PROVIDERS[st.cloud.p].models.map(([id, name]) => ({ label: name, value: id, on: st.cloud.m === id })), (m) => { st.cloud.m = m; render(); });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (menuOpen) closeMenu(); else if (st.page !== 'main') back(); } });

function syncBar() {
  for (const [id, cur] of [['variant', variant], ['theme', document.documentElement.dataset.theme], ['lang', lang]]) for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', b.dataset.v === cur);
  for (const b of document.querySelectorAll('#theme button')) b.textContent = t(b.dataset.v);
  for (const s of document.querySelectorAll('[data-s]')) s.textContent = t(s.dataset.s);
  $('#reset').textContent = t('reset');
  requestAnimationFrame(() => placeThumbs($('.pbar')));
}
$('#variant').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; variant = b.dataset.v; syncBar(); render(st.page === 'main' ? 0 : 1); });
$('#theme').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; document.documentElement.dataset.theme = b.dataset.v; syncBar(); });
$('#lang').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.v; document.documentElement.lang = lang; syncBar(); render(); });
$('#reset').addEventListener('click', () => { clearInterval(dlTimer); st = fresh(); render(-1); });
document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
syncBar(); st.page = 'cleanup'; render();
for (const ev of ['resize', 'load']) window.addEventListener(ev, () => placeThumbs(document, false));
document.addEventListener('visibilitychange', () => placeThumbs(document, false));
</script>
</body>
</html>
