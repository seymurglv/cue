<style>
/* CUE — shared tokens and the colors of the live mark.
   Free fonts (SIL OFL): Bebas Neue — logo and digits, Montserrat ExtraBold — rare large headings. */
:root{
  --bg:#FBFBFA;--card:#FFFFFF;--surface2:#F3F3F1;--text:#111111;--muted:#6B6B67;--faint:#C4C4C0;--line:#ECECE9;
  --rec:#FF4A1C;--warn:#EE9A00;--ask:#2F6BFF;--ok:#1E9E5A;--graphite:#1C1C1F;
  /* amber as the words of a button: --warn darkened to 4.5:1 on a button's fill in the light theme */
  --warn-ink:#945500;
  --mac-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --win-font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI","Inter",system-ui,sans-serif;
  --num-font:"Bebas Neue","Montserrat",sans-serif;
  --head-font:"Montserrat",sans-serif;
  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.3,1.25,.5,1);
}
[data-theme=dark]{
  --bg:#0E0E0F;--card:#151517;--surface2:#1C1C1F;--text:#ECECEA;--muted:#85858A;--faint:#4A4A4E;--line:#232326;
  --rec:#FF5A2E;--warn:#F5B82E;--ask:#5C8DFF;--ok:#33C27A;--graphite:#242428;
  --warn-ink:#F5B82E;
}
/* live mark: the lines take currentColor, the lamp takes the signal color */
.mk .m-l{stroke:currentColor;stroke-linecap:round;transition:stroke .3s}
.mk .m-dot{fill:var(--rec);transition:fill .3s}
.mk[data-tone=warn] .m-l{stroke:var(--warn)}
.mk[data-tone=warn] .m-dot{fill:var(--warn)}
.mk[data-tone=ask] .m-l{stroke:var(--ask)}
.mk[data-tone=ask] .m-dot,.mk[data-tone=askrec] .m-dot{fill:var(--ask)}
.mk[data-tone=mono] .m-dot{fill:currentColor}

/* CUE — the main window: its header, the History section and the settings tray from the gear. Ported from the approved    design (stage 5, design/05-main-window/final.html), Windows look, only these parts: no Today, Dictionary or Habits    sections and no links to them in the header, no window chrome of its own (Windows draws the frame), no dictionary or    habit chips under an opened history row. Layout, classes and motion are the design's; where it had a macOS and a    Windows variant, the Windows one is folded into the rule. The theme follows prefers-color-scheme (the page sets    data-theme on <html>; the tokens and their dark values are design/cue.css).    Added for the real data: a history row shows its mode (a small badge; none for a plain dictation, its place kept)    and its app as muted text before the text, an "Ask" question muted before the answer; a period note and a "not    connected" mark in menus; long menus scroll; a key field; quiet lines for an empty history and for nothing found.    Since: runs from one app stacked, the search grown out of the magnifier on the heading's line, an opened row's    recording as a thin progress line in place of the design's waveform, the history's period and Clear history on the    tray's History page instead of under the list; every control one capsule 28 px high (docs/specs/2026-11-02-selectors.md):    fields, drop-downs and the connection card with a hairline ring that darkens with the focus, buttons and segments    filled, menus rounded to match. */ *,*::before,*::after{box-sizing:border-box;margin:0;padding:0} html{color-scheme:light;background:var(--bg)} html[data-theme=dark]{color-scheme:dark} /* Before the page script has set the theme: no white flash in a dark Windows. */ @media (prefers-color-scheme: dark){html:not([data-theme]){background:#0E0E0F;color-scheme:dark}} html,body{height:100%} body{overflow:hidden;background:var(--bg);color:var(--text)} button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit} button:disabled{cursor:default} input{font:inherit;color:inherit;letter-spacing:inherit}  /* ================= the window ================= */ .app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--win-font);font-size:13px;line-height:1.45;letter-spacing:0;-webkit-font-smoothing:antialiased;interpolate-size:allow-keywords;--e-sm:cubic-bezier(.32,.72,0,1)} /* --e-sm: a smooth ease without overshoot for parts that grow (height to auto cannot overshoot: a spring is cut off).    Growing parts go from height 0 to auto, not grid rows 0fr to 1fr: Chromium resolves the fraction against the box's    own height, so while the box grows by f its content shows only f² of itself and an empty band opens under it. */ .app svg{display:block;flex:none} .app [hidden]{display:none!important} .app .mut{color:var(--muted)} .app mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:2px}  /* small parts */ .ibt{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s,opacity .2s} .ibt:hover{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text)} .ibt.sm{width:24px;height:24px;border-radius:6px} .ibt.sm svg{width:14px;height:14px} .ibt.done{color:var(--ok)} /* the keyboard's focus on an icon button: the soft plate and a dark glyph, not the system's ring */ .ibt:focus-visible{outline:0;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text)} /* icon buttons in headers — the gear, the tray's back and close, the search's cross — are the glyph alone: under the    pointer it darkens, pressed it gives a little; the target is 40 px round the 28 px button */ .gear,.tph .ibt,.hsb .hsbt{position:relative} .gear::before,.tph .ibt::before,.hsb .hsbt::before{content:"";position:absolute;inset:-6px} .gear:hover,.tph .ibt:hover,.hsb .hsbt:hover{background:none;color:var(--text)} .gear svg,.tph .ibt svg,.hsb .hsbt svg{transition:scale .2s var(--e-out)} .gear:active svg,.tph .ibt:active svg,.hsb .hsbt:active svg{scale:.88} .btn2{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 6px;border-radius:999px;background:color-mix(in srgb,var(--text) 7%,transparent);font-size:12px;font-weight:500;white-space:nowrap} .btn2 svg{width:14px;height:14px} .btn2:hover{background:color-mix(in srgb,var(--text) 11%,transparent)} .btn2.ck{padding:0 10px} /* "Clear history" */ .btn2.warn{color:var(--warn-ink)} .btn2 .lbl{display:inline-flex} .btn2:disabled{opacity:.5} /* a key field: a capsule with a hairline ring, as the history's search and the Dictionary's "+ Word"; the ring darkens    with the focus */ .kin{width:100px;height:28px;padding:0 12px;border:0;outline:0;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--faint);font-size:12px;color:var(--text);transition:box-shadow .2s} .kin:focus{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 45%,transparent)} .kin::placeholder{color:var(--muted)} /* switch */ .sw{position:relative;flex:none;width:40px;height:20px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 60%,transparent);transition:background .25s,box-shadow .25s} .sw::after{content:"";position:absolute;left:4px;top:4px;width:12px;height:12px;border-radius:50%;background:color-mix(in srgb,var(--text) 78%,transparent);transition:transform .4s var(--e-spring),background .25s} .sw[aria-checked=true]{background:var(--text);box-shadow:none} .sw[aria-checked=true]::after{transform:translateX(20px);background:var(--card)} /* segments: a capsule; the thumb and the buttons inside it are 2 px in, so their radius is 2 less */ .segc{position:relative;display:inline-flex;padding:2px;border-radius:14px;background:color-mix(in srgb,var(--text) 6%,transparent);isolation:isolate} .segc button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .2s} .segc button[aria-pressed=true]{color:var(--text)} .segc .thb{position:absolute;z-index:0;top:2px;bottom:2px;left:0;width:0;border-radius:12px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.06);transition:transform .45s var(--e-spring),width .45s var(--e-spring)} [data-theme=dark] .segc .thb{background:color-mix(in srgb,var(--text) 15%,transparent)} /* drop-down: the field's capsule and ring; under the pointer the ring darkens */ .dd{display:inline-flex;align-items:center;gap:6px;height:28px;max-width:190px;padding:0 10px 0 12px;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--faint);font-size:12px;white-space:nowrap;transition:box-shadow .2s} .dd:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 30%,transparent)} .dd .ddv{overflow:hidden;text-overflow:ellipsis} .dd svg{width:12px;height:12px;color:var(--muted);transform:rotate(90deg)} /* the Cleanup page's connection card: a lamp (green once the connection is ready), the name, its state under it; it opens    the list of connections at its own width. The drop-down's ring at the card's size. */ .srow.wide{display:block} .pk{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 12px 6px 14px;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--faint);text-align:left;transition:box-shadow .2s} .pk:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 30%,transparent)} .pk .pt{flex:1;min-width:0} .pk .pt b{display:block;font-weight:500;font-size:13px} .pk .pt small{display:block;margin-top:1px;overflow:hidden;font-size:11px;line-height:1.35;color:var(--muted);text-overflow:ellipsis;white-space:nowrap} .pk>svg{flex:none;width:12px;height:12px;color:var(--muted);transform:rotate(90deg)} .pk .lamp,.menu .mlamp{flex:none;width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--text) 25%,transparent);transition:background-color .3s} .pk .lamp.on,.menu .mlamp.on{background:var(--ok)} /* a local server's address is longer than a key's mask: the field takes the line under the row's name */ .srow[data-server]{flex-wrap:wrap;row-gap:6px} .srow[data-server] .stx{flex-basis:100%} .srow[data-server] .sc{flex:1 1 100%;max-width:none;flex-wrap:nowrap} .srow[data-server] .kin{flex:1;width:auto;min-width:0} /* the custom style's instructions: the fields' ring */ .cta{display:block;width:100%;min-height:64px;resize:vertical;padding:8px 12px;border:0;outline:0;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--faint);font:inherit;font-size:12px;line-height:1.45;color:var(--text);transition:box-shadow .2s} .cta:focus{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 45%,transparent)} /* menus: 4 px in from the edge, so an item's radius is 4 less than the menu's */ .menu{position:absolute;z-index:45;min-width:180px;max-width:320px;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;padding:4px;border-radius:14px;background:var(--card);box-shadow:0 14px 32px -10px rgba(0,0,0,.32),0 0 0 .5px color-mix(in srgb,var(--text) 18%,transparent);transform-origin:50% 0;animation:mnIn .32s var(--e-spring)} [data-theme=dark] .menu{background:#222225} .menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:28px;padding:0 8px 0 10px;border-radius:10px;font-size:12px;text-align:left;white-space:nowrap} .menu button:hover{background:color-mix(in srgb,var(--text) 6%,transparent)} .menu button svg{width:14px;height:14px} .menu .mlb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis} .menu .mnc{font-size:11px;color:var(--muted)} /* a richer list: group headings, two lines (a name and its state or price), a quiet chip, a lamp; as wide as its button */ .menu .mg{padding:8px 10px 3px;font-size:11px;font-weight:600;color:var(--muted)} .menu .mg:first-child{padding-top:4px} .menu.two button{height:auto;min-height:28px;padding-top:5px;padding-bottom:5px} .menu .mt{display:flex;flex:1;flex-direction:column;min-width:0} .menu .mt .mlb{font-weight:500} .menu .msub{overflow:hidden;font-size:11px;color:var(--muted);text-overflow:ellipsis} .menu .mbadge{flex:none;padding:1px 6px;border-radius:9px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 16%,transparent);font-size:11px;color:var(--muted)} .menu.wide{max-width:none} .menu .mnote{padding:6px 10px 4px;border-top:1px solid var(--line);margin-top:4px;font-size:11px;line-height:1.35;color:var(--muted);white-space:normal} @keyframes mnIn{from{opacity:0;transform:translateY(-4px) scale(.97)}} /* microphone level */ .meter{display:flex;gap:2px;align-items:center;height:14px} .meter i{width:4px;height:100%;border-radius:2px;background:color-mix(in srgb,var(--text) 12%,transparent);transition:background .08s} .meter i.on{background:var(--text)}  /* history */ .hday{font-size:11px;font-weight:600;color:var(--muted);margin:16px 0 4px} .hgrp:first-child .hday{margin-top:2px} .hl{display:flex;flex-direction:column;margin:0 -8px} /* the list stays short: the rest of today and every earlier day grow out of their line and fold back into it */ .hfold{height:0;overflow:hidden;visibility:hidden;transition:height .5s var(--e-sm),visibility 0s .5s} .hfold.open{height:auto;visibility:visible;transition:height .5s var(--e-sm)} .hmt{display:flex;width:calc(100% + 16px);margin:2px -8px 0;padding:8px;border-radius:8px;font-size:12px;line-height:20px;color:var(--muted);text-align:left;transition:background .2s,color .2s} .hmt:hover,.hdl:hover{background:color-mix(in srgb,var(--text) 4%,transparent)} .hmt:hover{color:var(--text)} .hearl{margin-top:20px} .hdl{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:10px;align-items:center;width:calc(100% + 16px);margin:0 -8px;padding:8px;border-radius:8px;font-size:13px;line-height:20px;color:var(--text);text-align:left;transition:background .2s} .hdapps{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hdl .hcnt{margin:0} .hdl svg{width:12px;height:12px;color:var(--muted);transition:transform .45s var(--e-spring)} .hfd.open>.hdl svg{transform:rotate(90deg)} .hfd.open>.hdl .hcnt{background:color-mix(in srgb,var(--text) 13%,transparent);color:var(--text)} .hmt:focus-visible,.hdl:focus-visible{outline:0;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 40%,transparent)} .hr{position:relative;display:grid;grid-template-columns:38px 20px 1fr auto;column-gap:10px;align-items:start;padding:8px;border-radius:8px;transition:background .2s} .hr:hover{background:color-mix(in srgb,var(--text) 4%,transparent)} .hr.new{animation:rowIn .6s var(--e-spring),rowHl 2.6s var(--e-out)} @keyframes rowIn{from{opacity:0;transform:translateY(-8px)}} @keyframes rowHl{0%,30%{background:color-mix(in srgb,var(--text) 8%,transparent)}} .ht{font-family:"Bebas Neue",sans-serif;font-size:15px;letter-spacing:.03em;line-height:20px;color:var(--muted);font-variant-numeric:tabular-nums} .aski,.hmi{width:20px;height:20px;border-radius:6px;display:grid;place-items:center} .aski{background:color-mix(in srgb,var(--ask) 14%,transparent);color:var(--ask)} .hmi{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--muted)} .aski svg,.hmi svg{width:14px;height:14px} .hx{min-width:0} .htx{height:20px;font-size:13px;line-height:20px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;transition:height .45s var(--e-sm)} .htx .happ,.htx .hq{color:var(--muted);margin-right:6px} .hact{display:flex;gap:2px;margin:-3px -4px -3px 0;opacity:0;transition:opacity .2s} .hr:hover .hact,.hr:focus-within .hact,.hr.open .hact{opacity:1} /* an opened row: its whole text, then how it was said and its recording (the question of an "Ask" moves down there);    both grow in one motion, and while it closes (.shut const prov = () => CLOUD.find(([id]) => id === st.cloud.p);
const pName = () => prov()[1];
const mName = () => prov()[2].find(([id]) => id === st.cloud.m)[1];
const lm = () => LOCAL[st.local];

const head = (title, back) => `<div class="tph">${back ? `<button class="ibt back" type="button" data-act="back" aria-label="Back">${I.chev}</button>` : ''}<b class="lbl">${title}</b><button class="ibt" type="button" data-act="close" aria-label="Close">${I.close}</button></div>`;
const trw = (icon, label, val, act) => `<button class="trw${act ? '' : ' inert'}" type="button" data-act="${act || 'inert'}"><span class="si">${I[icon]}</span><span>${label}</span><em>${val}</em>${I.chev}</button>`;
const row = (b, small, right, attrs = '') => `<div class="srow"${attrs}><div class="stx"><b>${b}</b>${small ? `<small>${small}</small>` : ''}</div><div class="sc">${right}</div></div>`;
const sw = (on) => `<button class="sw" type="button" role="switch" data-act="toggle" aria-checked="${on}" aria-label="${t('clean')}"></button>`;

function cleanupValue() {
  if (!st.on) return lang === 'ru' ? 'Выкл' : 'Off';
  if (st.where === 'cloud') return mName();
  if (st.dl) return `${t('downloading')} ${Math.round(st.dl.p)} %`;
  return lm().name;
}
function pageMain() {
  return head(t('settings'), false) + `<div class="tpb"><div role="group">${trw('model', t('speech'), t('speechVal'))}${trw('cleanup', t('cleanup'), cleanupValue(), 'cleanup')}${trw('mic', t('mic'), t('micVal'))}${trw('languages', t('languages'), t('langVal'))}${trw('history', t('history'), t('histVal'))}${trw('general', t('general'), t('genVal'))}<div style="border-top:1px solid var(--line);margin:6px 0"></div><button class="trw" type="button" data-act="agent"><span class="si">${I.agent}</span><span>${t('agent')}</span><em></em>${I.chev}</button></div></div>`;
}

function keyRow() {
  const p = st.cloud.p, name = pName(), saved = !!st.keys[p], c = st.conn[p];
  const get = `<a href="#" class="klink" data-act="getkey">${t('getKey')}</a>`;
  let small = !saved ? `${t('keyNeed')} · ${get}` : c === 'checking' ? t('checking') : c === 'connected' ? `<span class="ok-ink">${t('connected')}</span>${p === 'anthropic' ? ' · ' + t('askToo') : ''}` : '';
  return row(t('key', name), small, `<input class="kin" type="password" autocomplete="off" spellcheck="false" id="kin" placeholder="${saved ? st.keys[p] : t('keyPaste')}" style="width:92px"><button class="btn2 ck" type="button" data-act="check"${saved && c !== 'checking' ? '' : ' disabled'}>${t('check')}</button>`);
}
const dd = (v, act) => `<button class="dd" type="button" data-act="${act}"><span class="ddv">${v}</span>${I.chev}</button>`;
const price = (i, o) => `$${i.toFixed(2)} · $${o.toFixed(2)}`;
function tiles() {
  return `<div class="tiles" role="radiogroup" aria-label="${t('service')}">${CLOUD.map(([p, name]) => {
    const on = st.cloud.p === p, ok = st.conn[p] === 'connected';
    return `<button type="button" class="tile${on ? ' on' : ''}" role="radio" aria-checked="${on}" data-act="provider" data-p="${p}"><span class="tn">${name}</span><span class="ts${ok ? ' ok-ink' : ''}">${ok ? I.ok + t('ready') : t('noKey')}</span></button>`;
  }).join('')}</div>`;
}
function cloudDetails() {
  const m = prov()[2].find(([id]) => id === st.cloud.m);
  const modelRight = prov()[2].length > 1 ? dd(mName(), 'm-cloud') : `<span class="msz">${mName()}</span>`;
  return `<div class="mgh" style="margin-top:6px">${t('service')}</div>${tiles()}` + keyRow() + row(t('model'), `${price(m[2], m[3])} ${t('perM')}${st.cloud.p === 'anthropic' && st.cloud.m === 'haiku' ? ' · ' + t('rec') : ''}`, modelRight);
}
function localDetails() {
  const id = st.local, m = lm();
  let status;
  if (st.dl && st.dl.id === id) status = `<span class="msz num-t">${Math.round(st.dl.p)} %</span><button class="btn2 ck" type="button" data-act="stop">${t('stop')}</button>`;
  else if (!st.have[id]) status = `<button class="btn2 ck" type="button" data-act="download">${t('download')} · ${gb(m.size)}</button>`;
  else status = `<span class="mok ok-ink">${I.ok}</span>`;
  const small = (st.dl && st.dl.id === id) ? `${t('downloading')}<div class="pbarline"><i style="width:${st.dl.p}%"></i></div>` : `${m.langs === 'en' ? t('en') : t('ruen')}${m.rec ? ' · ' + t('rec') : ''}${st.have[id] ? '' : ' · ' + t('notYet').toLowerCase()}`;
  return row(m.name, small, status) + row(t('otherModels'), null, dd(lang === 'ru' ? 'Выбрать' : 'Choose', 'm-local'));
}
const instrRow = () => `<div class="srow pick" data-act="instr"><div class="stx"><b>${t('instr')}</b><small>${st.instr.trim() ? t('instrSet') : t('instrHint')}</small></div><div class="sc">${I.chev}</div></div>`;
function footer() { if (!st.on) return t('ftOff'); return st.where === 'cloud' ? t('ftCloud', pName(), mName()) : t('ftLocal'); }

function pageCleanup() {
  let body = row(t('clean'), st.on ? t('cleanOn') : t('cleanOff'), sw(st.on));
  if (st.on) {
    if (layout === 'cards') {
      const card = (where, title, sub) => `<div class="opt${st.where === where ? ' on' : ''}" data-act="where" data-v="${where}"><span class="radio${st.where === where ? ' on' : ''}"></span><div class="stx"><b>${title}</b><small>${sub}</small></div></div>`;
      body += `</div><div class="optwrap">${card('cloud', t('cloud'), t('cloudSub', pName(), mName()))}${card('local', t('local'), t('localSub', lm().name, gb(lm().size)))}</div><div class="sgrp det">`;
    } else {
      body += `<div class="srow wide"><span class="segc" id="where" style="width:100%;display:flex"><span class="thb"></span>${[['cloud', t('cloudShort')], ['local', t('localShort')]].map(([v, l]) => `<button type="button" data-seg="where" data-v="${v}" style="flex:1" aria-pressed="${st.where === v}">${l}</button>`).join('')}</span></div>`;
    }
    body += st.where === 'cloud' ? cloudDetails() : localDetails();
    body += instrRow();
  }
  return head(t('cleanup'), true) + `<div class="tpb"><div class="sgrp">${body}</div><div class="tft">${footer()}</div></div>`;
}

function promptText() {
  return `You are setting up CUE, a Windows dictation app, for me.

CUE keeps its settings in one JSON file:
  %APPDATA%\\CUE\\settings.json
CUE notices when the file changes and applies it.

First ask me, one question at a time:
1. Which languages I dictate in, and where (apps, kinds of text).
2. How my text should read (tone, length, emoji, terms to keep).
3. Names, brands and terms CUE must spell right.

Then edit the file:
- refine.on (true/false), refine.runs ("cloud" or "local")
- refine.custom: my instructions, in plain words, at most 8 lines
- dictionary.terms: the names and terms, one per entry
- translate.target: the language translations go to

Rules:
- Back up the file first (settings.json.bak) and keep it valid JSON.
- Change only the fields above; leave everything else as it is.
- Never write API keys anywhere. If one is needed, tell me to paste it in CUE: Settings → Cleanup → key.
- When done, show me what you changed.

Now:
- Cleanup: ${st.on ? (st.where === 'cloud' ? `cloud, ${pName()} ${mName()}` : `this computer, ${lm().name}`) : 'off'}
- Instructions: ${st.instr.trim() ? '"' + st.instr.trim().slice(0, 80) + '"' : 'none'}
- Interface language: ${lang === 'ru' ? 'Russian' : 'English'}`;
}
function pageAgent() {
  return head(t('agent'), true) + `<div class="tpb"><div class="sgrp" style="padding-top:4px"><div style="font-size:12px;color:var(--muted)">${t('copied')}</div><div class="prompt" id="ptext"></div><div class="agentrow"><button class="btn2 ck" type="button" data-act="copy">${I.copy}<span class="lbl">${t('copyAgain')}</span></button></div></div><div class="tft">${t('agentFt')}</div></div>`;
}
function pageInstr() {
  return head(t('instr'), true) + `<div class="tpb"><div class="sgrp" style="padding-top:6px"><textarea class="cta" id="cta" rows="4" placeholder="${t('instrPh')}">${st.instr.replace(/</g, '&lt;')}</textarea></div><div class="tft">${t('instrFt')}</div></div>`;
}

const PAGES = { main: pageMain, cleanup: pageCleanup, agent: pageAgent, instr: pageInstr };
const DEPTH = { main: 0, cleanup: 1, agent: 1, instr: 2 };

function placeThumbs(root = document, animate = true) {
  for (const s of root.querySelectorAll('.segc')) {
    const on = s.querySelector('[aria-pressed="true"]'), th = s.querySelector('.thb');
    if (!on || !th || !on.offsetWidth) continue;
    if (!animate) th.style.transition = 'none';
    th.style.width = on.offsetWidth + 'px';
    th.style.transform = `translateX(${on.offsetLeft - 2}px)`;
    if (!animate) { th.offsetWidth; th.style.transition = ''; }
  }
}
function render(dir = 0) {
  closeMenu();
  const tray = $('#tray'), tpg = $('#tpg');
  const keep = {};
  if (dir === 0) for (const s of tpg.querySelectorAll('.segc')) keep[s.id] = s.querySelector('.thb').style.cssText;
  const from = tray.offsetHeight;
  tpg.innerHTML = PAGES[st.page]();
  for (const [id, css] of Object.entries(keep)) { const th = $(`#${id} .thb`, tpg); if (th) { th.style.cssText = css; th.style.transition = 'none'; th.offsetWidth; th.style.transition = ''; } }
  tray.style.height = 'auto';
  const to = tray.offsetHeight;
  // The height eases from the old page's to the new one's, then goes back to auto, so a page measured before the viewer
  // laid it out never stays collapsed.
  if (from > 0 && to > 0 && from !== to) {
    tray.style.height = from + 'px'; tray.offsetHeight; tray.style.height = to + 'px';
    clearTimeout(tray._auto); tray._auto = setTimeout(() => { tray.style.height = 'auto'; }, 460);
  }
  requestAnimationFrame(() => placeThumbs(tpg, true));
  if (dir && !matchMedia('(prefers-reduced-motion: reduce)').matches) $('.tpb', tpg).animate([{ transform: `translateX(${dir * 26}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.32,.72,0,1)' });
  const pt = $('#ptext'); if (pt) pt.textContent = promptText();
  const cta = $('#cta'); if (cta) { cta.addEventListener('input', () => { st.instr = cta.value; }); setTimeout(() => cta.focus(), 340); }
  const kin = $('#kin');
  if (kin) kin.addEventListener('keydown', (e) => { if (e.key === 'Enter' && kin.value.trim()) { const v = kin.value.trim(); st.keys[st.cloud.p] = `${v.slice(0, 3)}…${v.slice(-3)}`; checkKey(); } });
  $('#vnote').innerHTML = t(layout === 'cards' ? 'noteCards' : 'noteSwitch') + (st.page === 'cleanup' && st.where === 'local' ? ' ' + t('noteLocal') : '');
}
function go(page) { const d = DEPTH[page] >= DEPTH[st.page] ? 1 : -1; st.page = page; render(d); }
function back() { go(st.page === 'instr' ? 'cleanup' : 'main'); }
function toast(text) { const el = $('#toast'); el.textContent = text; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.opacity = 0; }, 1800); }
function checkKey() { const p = st.cloud.p; st.conn[p] = 'checking'; render(); setTimeout(() => { st.conn[p] = 'connected'; render(); }, 900); }
async function copyPrompt() { try { await navigator.clipboard.writeText(promptText()); toast(t('copied')); } catch { toast(t('copied')); } }
function startDownload() {
  const id = st.local; st.dl = { id, p: 0 }; clearInterval(dlTimer);
  dlTimer = setInterval(() => {
    st.dl.p = Math.min(100, st.dl.p + 2 + Math.random() * 2.6);
    if (st.dl.p >= 100) { clearInterval(dlTimer); st.have[id] = true; st.dl = null; render(); return; }
    for (const b of document.querySelectorAll('.pbarline i')) b.style.width = st.dl.p + '%';
    for (const n of document.querySelectorAll('.num-t')) n.textContent = Math.round(st.dl.p) + ' %';
  }, 120);
  render();
}
function closeMenu() { if (menuOpen) { menuOpen.m.remove(); menuOpen = null; } }
function menu(button, items, pick) {
  if (menuOpen && menuOpen.b === button) { closeMenu(); return; }
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  let group;
  items.forEach((it, i) => {
    if (it.group && it.group !== group) { const g = document.createElement('div'); g.className = 'mg'; g.textContent = it.group; m.append(g); }
    group = it.group;
    const b = document.createElement('button'); b.type = 'button'; b.dataset.i = i;
    b.innerHTML = `${it.lamp !== undefined ? `<span class="mlamp${it.lamp ? ' on' : ''}"></span>` : ''}<span class="mlb">${it.label}</span>${it.note ? `<span class="mnc">${it.note}</span>` : ''}${it.on ? I.ok : ''}`;
    m.append(b);
  });
  m.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (!b) return; const it = items[+b.dataset.i]; closeMenu(); pick(it.value); });
  const app = $('#app'); app.append(m);
  m.style.maxHeight = '300px';
  const ar = app.getBoundingClientRect(), br = button.getBoundingClientRect();
  m.style.left = (br.right - ar.left - m.offsetWidth + app.scrollLeft) + 'px';
  m.style.top = (br.bottom - ar.top + 4 + app.scrollTop) + 'px';
  m.animate([{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'none' }], { duration: 160, easing: 'ease-out' });
  menuOpen = { m, b: button };
}
document.addEventListener('click', (e) => {
  if (e.target.closest('.pbar')) return;
  const el = e.target.closest('[data-act], [data-seg]');
  if (!el) { if (!e.target.closest('.menu')) closeMenu(); return; }
  if (el.dataset.seg) {
    const v = el.dataset.v; for (const b of document.querySelectorAll('#where button')) b.setAttribute('aria-pressed', b.dataset.v === v);
    placeThumbs($('#where').parentElement); st.where = v; setTimeout(() => render(), 0); return;
  }
  const a = el.dataset.act;
  if (a === 'cleanup' || a === 'instr') go(a);
  else if (a === 'agent') { go('agent'); copyPrompt(); }
  else if (a === 'copy') copyPrompt();
  else if (a === 'back') back();
  else if (a === 'close') { st.page = 'main'; render(-1); }
  else if (a === 'inert') toast(t('inert'));
  else if (a === 'toggle') { st.on = !st.on; render(); }
  else if (a === 'where') { st.where = el.dataset.v; render(); }
  else if (a === 'download') startDownload();
  else if (a === 'stop') { clearInterval(dlTimer); st.dl = null; render(); }
  else if (a === 'check') checkKey();
  else if (a === 'provider') { const p = el.dataset.p; st.cloud = { p, m: st.picked[p] || CLOUD.find(([id]) => id === p)[2][0][0] }; render(); }
  else if (a === 'getkey') { e.preventDefault(); toast(t('keyAt', prov()[3])); }
  else if (a === 'm-cloud') menu(el, prov()[2].map(([m, label, i, o]) => ({ label, note: price(i, o), value: m, on: st.cloud.m === m })), (m) => { st.cloud.m = m; st.picked[st.cloud.p] = m; render(); });
  else if (a === 'm-local') menu(el, Object.entries(LOCAL).map(([id, m]) => ({ label: m.name, note: `${gb(m.size)}${m.langs === 'en' ? ' · EN' : ''}`, value: id, on: st.local === id })), (id) => { st.local = id; render(); });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (menuOpen) closeMenu(); else if (st.page !== 'main') back(); } });

function syncBar() {
  for (const [id, cur] of [['layout', layout], ['theme', document.documentElement.dataset.theme], ['lang', lang]]) for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', b.dataset.v === cur);
  for (const b of document.querySelectorAll('#theme button, #layout button')) b.textContent = t(b.dataset.v);
  for (const s of document.querySelectorAll('[data-s]')) s.textContent = t(s.dataset.s);
  $('#reset').textContent = t('reset');
  requestAnimationFrame(() => placeThumbs($('.pbar')));
}
$('#layout').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; layout = b.dataset.v; syncBar(); render(); });
$('#theme').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; document.documentElement.dataset.theme = b.dataset.v; syncBar(); });
$('#lang').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.v; document.documentElement.lang = lang; syncBar(); render(); });
$('#reset').addEventListener('click', () => { clearInterval(dlTimer); st = fresh(); st.page = 'cleanup'; render(-1); });
document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
syncBar(); st.page = 'cleanup'; render();
for (const ev of ['resize', 'load']) window.addEventListener(ev, () => placeThumbs(document, false));
document.addEventListener('visibilitychange', () => placeThumbs(document, false));
</script>
</body>
</html>
