[package]
name = "cue-engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cue-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
keyring.workspace = true
tracing.workspace = true
realfft.workspace = true
ort.workspace = true
llama-cpp-2.workspace = true
hound.workspace = true
sha1.workspace = true
sha2.workspace = true
getrandom.workspace = true

[target.'cfg(windows)'.dependencies]
# The processor's cores, for the local model's threads; a Job object that ends an agent's whole process tree
# (`agent::process`); the fake agent's console check.
windows = { workspace = true, features = [
  "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security",
  "Win32_System_Console",
] }

[target.'cfg(windows)'.dev-dependencies]
# The speech model probe's memory (examples/stt_probe.rs).
windows = { workspace = true, features = ["Win32_System_ProcessStatus"] }

[dev-dependencies]
anyhow.workspace = true
# A response built without the network, in tests of reading replies.
http = "1"
cpal.workspace = true
# Virtual time in session tests (`start_paused`): deadlines are checked exactly, independent of machine load.
tokio = { workspace = true, features = ["test-util"] }
